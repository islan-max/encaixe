<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block titulo %}Encaixe{% endblock %}</title>
  <meta name="description" content="{% block descricao %}Agenda para autônomos: o cliente marca sozinho, você manda o lembrete com um toque.{% endblock %}">
  {% block robots %}{% endblock %}
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/estilo.css">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="conteudo">
      <a class="marca" href="/">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="#0b6b3a"/><rect x="5" y="9" width="13" height="14" rx="3.5" fill="#25d366"/><rect x="14" y="9" width="13" height="14" rx="3.5" fill="#fff" stroke="#0b6b3a" stroke-width="2"/></svg>
        Encaixe
      </a>
      <nav class="menu" aria-label="Principal">
        {% if usuario %}
          <a href="/painel">Meu painel</a>
          {% if csrf %}
          <form method="post" action="/sair">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="link" type="submit">Sair</button>
          </form>
          {% endif %}
        {% else %}
          <a href="/entrar">Entrar</a>
          <a href="/cadastrar">Criar conta</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main id="conteudo" tabindex="-1">
    <div class="conteudo">
      {% block conteudo %}{% endblock %}
    </div>
  </main>
  <footer class="rodape">
    <div class="conteudo">
      <span>Encaixe é grátis e de código aberto.</span>
      <a href="/privacidade">Privacidade</a>
      <a href="/termos">Termos de uso</a>
    </div>
  </footer>
</body>
</html>
